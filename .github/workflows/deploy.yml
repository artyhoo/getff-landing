name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      # R5 ordering (S1 BUILD): the framework pin is materialised BEFORE
      # `npm ci` — the postinstall (`fumadocs-mdx`) reads source.config.ts and
      # the build consumes docs/site/** from .framework/.
      - name: Fetch framework at the pin (before npm ci — R5)
        run: node scripts/fetch-framework.mjs

      # D37/D51(5): second full-surface checkout at the SAME resolved SHA, so
      # the deploy-time redirect coverage gate audits the tree that was built.
      - name: Full-surface framework checkout at the same resolved SHA
        env:
          FRAMEWORK_PIN: ${{ runner.temp }}/framework-pinned.pin
        run: |
          set -euo pipefail
          SHA="$(cat .framework/SHA)"
          echo "FRAMEWORK_SHA=$SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$SHA" > "$FRAMEWORK_PIN"
          node scripts/fetch-framework.mjs --full .framework-full
          test "$(cat .framework-full/SHA)" = "$SHA"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # R7/D51(5): the deploy channel gates redirects too, not just the PR —
      # the old-URL surface must hold on main, at the pin, every deploy.
      - name: Write redirect stubs (R7, both shapes)
        run: node scripts/write-redirect-stubs.mjs

      - name: Redirect coverage gate over enumerated old URLs (R7/R21/D37)
        run: node scripts/check-redirects.mjs --framework-full .framework-full

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
